name: collect（Keepa からの取得）

# 予約実行（時刻は UTC。日本時間は +9 時間）
# GitHub の予約実行は時刻が保証されず、遅れたり 1 回分が飛んだりする。
# そこで各回の時刻のあとに何度か起動し、auto ジョブが「まだ取得していない回」だけを実行する。
# 取得済みなら Keepa を呼ばずに数十秒で終わる。
#   朝の取得（自社商品の取り込みから全部）… 02:07〜06:37 JST に 30 分おき
#   競合の価格（10 時 / 14 時 / 19 時 JST）… 各回 :07、:37、翌時 :07 の 3 回
on:
  schedule:
    - cron: '7,37 17-21 * * *'
    - cron: '7,37 1,5,10 * * *'
    - cron: '7 2,6,11 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: '実行するジョブ'
        type: choice
        options: [auto, prices, daily, candidates, research]
        default: auto

permissions:
  contents: read

# 2 つ同時に動くとトークンを取り合うので、1 つずつ順番に実行する
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: ジョブを決める
        id: job
        env:
          EVENT: ${{ github.event_name }}
          INPUT_JOB: ${{ inputs.job }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "name=$INPUT_JOB" >> "$GITHUB_OUTPUT"
          else echo "name=auto" >> "$GITHUB_OUTPUT"; fi
      - name: 取得を実行
        env:
          JOB: ${{ steps.job.outputs.name }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DASHBOARD_PROJECT_ID: ${{ secrets.DASHBOARD_PROJECT_ID }}
          DASHBOARD_ACCOUNTS: ${{ secrets.DASHBOARD_ACCOUNTS }}
          MAX_RUNTIME_MINUTES: '300'
        run: python -m collector "$JOB"
